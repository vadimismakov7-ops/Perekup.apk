bk:()=>{const w=NW();return`<h3>Мобильный банк</h3>${bankApp()}<div class=cd><b>Советы ИИ</b>${(G.tips||[]).map(t=>`<div class=m>• ${t}</div>`).join('')||'<div class=m>Нажмите «Совет ИИ» ниже.</div>'}</div><h3>Новости и финансы</h3><div class=cd><b>📰 Новости</b>${G.news.map(n=>`<div class=m>${n}</div>`).join('')||'<div class=m>Пока тихо.</div>'}</div><div class=cd><b>Цель: 10 000 000 ₽ капитала</b><div class=m>Сейчас ${f(w)}${w>=1e7?' — победа! 🎉':''}</div><div class=bar><i style="width:${Math.min(100,w/1e5)}%"></i></div></div><div class=cd><b>Кредит</b> 1,2% в день<div class=m>Долг ${f(G.debt)}, лимит ${f(50000+G.rep*3000)}</div>${[10000,50000,200000].map(n=>`<button onclick="loan(${n})">+${f(n)}</button>`).join('')}<br>${[10000,100000].map(n=>`<button class=s onclick="repay(${n})">Вернуть ${f(n)}</button>`).join('')}<button class=s onclick="repay(1e12)">Всё</button></div><div class=cd><b>🤖 ИИ-кредиты: ${G.ai}</b><div class=m>Нужны для оценки лота, описания и совета.</div><button onclick="buyAI()">+5 за ${f(1500)}</button><button class=s onclick="adv()">Совет ИИ</button></div><div class=cd><div class=m>Продано сделок: ${G.sold}. Репутация: ${G.rep}.</div><button class=s onclick="rst()">Начать заново</button></div><p class=m onclick="admTap()" style="text-align:center;margin-top:18px">Перекуп v2.1</p>`}};
function sceneOld(){const t=(e,x,y,s,c)=>`<text x="${x}" y="${y}" font-size="${s}" text-anchor="middle" fill="${c||'#fff'}">${e}</text>`,
defs='<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a8c"/><stop offset=".6" stop-color="#e8506a"/><stop offset="1" stop-color="#f7b267"/></linearGradient></defs>',
out='<rect width="320" height="120" fill="url(#sg)"/><circle cx="262" cy="66" r="22" fill="#ffd27a"/><path d="M0 98Q80 66 160 96T320 90V120H0z" fill="#2a6b50"/>'+[12,44,288].map(x=>`<path d="M${x-12} 100l12-36 12 36z" fill="#1d4d3b"/>`).join('')+'<rect y="100" width="320" height="20" fill="#27493f"/>',
its=G.items.filter(i=>i.cat!='car'),cars=G.items.filter(i=>i.cat=='car');let b='';
if(T=='mk'){const ls=G.mk.filter(l=>l.cat!='car');b=out+[0,1,2].map(k=>{const x=62+k*98;return`<rect x="${x-38}" y="50" width="76" height="14" fill="${k%2?'#fff':'#e8506a'}"/><rect x="${x-34}" y="88" width="68" height="12" fill="#7a5230"/>`+(ls[k]?t(ls[k].ic,x,86,28):'')}).join('')+t('БАРАХОЛКА',160,20,13)}
else if(T=='st'){b='<rect width="320" height="120" fill="#33465a"/><rect y="54" width="320" height="5" fill="#7a5230"/><rect y="102" width="320" height="5" fill="#7a5230"/>'+its.slice(0,10).map((i,k)=>t(i.ic,30+(k%5)*65,k<5?50:98,28)).join('')+t('СКЛАД '+its.length+'/'+G.ic,160,18,12)}
else if(T=='ga'){const n=Math.min(G.gc,4),w=320/n;b='<rect width="320" height="120" fill="#4a5360"/><rect y="98" width="320" height="22" fill="#2e343d"/>';for(let k=0;k<n;k++){const x=w*k+w/2;b+=`<rect x="${x-w/2+6}" y="28" width="${w-12}" height="70" fill="none" stroke="#fff6" stroke-dasharray="4"/>`+(cars[k]?t(cars[k].ic,x,88,46):t('➕',x,70,20))}b+=t('ГАРАЖ '+cars.length+'/'+G.gc,160,16,12)}
else if(T=='ho'){const PS=[[30,40],[72,40],[104,70],[216,40],[258,40],[296,40],[40,88],[90,90],[225,90],[270,90]];b='<rect width="320" height="120" fill="'+HM[G.hm||0][4]+'"/><rect y="94" width="320" height="26" fill="#8a6a4a"/><rect x="134" y="14" width="52" height="46" fill="url(#sg)" stroke="#fff" stroke-width="3"/>'+t('🛏',160,116,38)+(G.items.some(i=>i.st==1)?'<rect x="98" y="12" width="32" height="44" fill="#f7b267" stroke="#fff" stroke-width="2"/>'+t('🚌',114,38,20)+t('ЛЕТО',114,52,8,'#1b2a2c'):'');G.room.slice(0,10).forEach((d,k)=>{const p=PS[k];b+=`<rect x="${p[0]-16}" y="${p[1]-26}" width="32" height="34" rx="3" fill="#fff3"/>`+t(DC[d][1],p[0],p[1],24)})}
else if(T=='tp')b=out+'<rect y="100" width="320" height="20" fill="#3a3a44"/><path d="M0 110H320" stroke="#fff" stroke-dasharray="10 8"/>'+t('🚌',160,104,40)+t('📍 '+G.city,160,20,13);
else b=out+t(T=='ap'?'📱':'💰',160,100,44)+t(T=='ap'?'ОНЛАЙН':f(NW()),160,20,13);
return`<div class="sc"><svg viewBox="0 0 320 120">${defs}${b}</svg></div><div class=nw>📰 ${G.news[0]||'Новостей пока нет'}</div>`}
const NV=[['mk','🛒','Рынок'],['ap','📱','Онлайн'],['st','📦','Склад'],['ga','🚗','Гараж'],['ho','🏠','Дом'],['tp','✈','Город'],['bk','🏦','Банк']];
function ren(){try{localStorage.setItem('prk1',JSON.stringify(G))}catch(e){}if(!G.pp)return onb();if(G.sty)return styUI();
const x=deal&&G.items.find(i=>i.id==deal.id);
$('#app').innerHTML=`<header><button onclick="nextDay()">🌙 Спать</button><div class=r><b>${f(G.cash)}</b><span>День ${G.day}</span><span>📍${G.city}</span></div><div class=r><span>⚡${G.e}</span><span>💤${G.z}%</span><span>🤖${G.ai}</span><span>⭐${G.rep}</span><span>Долг ${f(G.debt)}</span></div></header><main>${scene()}${TB[T]()}</main><nav>${(ADM?[...NV,['ad','⚙','Тест']]:NV).map(n=>`<button class="${T==n[0]?'on':''}" onclick="T='${n[0]}';ren();scrollTo(0,0)"><i>${n[1]}</i>${n[2]}</button>`).join('')}</nav>`+(x?`<div class=ov><div class=cd><b>${x.ic} ${x.n}</b><p>Покупатель даёт <b>${f(deal.o)}</b></p><div class=m>Вы брали за ${f(x.b)}: ${deal.o>=x.b?'прибыль':'убыток'} ${f(Math.abs(deal.o-x.b))}</div><button onclick="dAcc()">Отдать</button><button class=s onclick="dHg()">🤝 Торг (⚡1)</button><button class=s onclick="dTr()" ${deal.cr?'disabled':''}>🎭 Приврать</button><button class=s onclick="deal=null;ren()">Отказать</button></div></div>`:'')}
if(!G||!G.items){G=init();gen()}ren();
</script></body></html>
